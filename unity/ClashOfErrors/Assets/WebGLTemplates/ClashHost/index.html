<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="clash-unity-build" content="1">
  <title>Clash of Errors — Unity</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d20}canvas{display:block;width:100%;height:100%;outline:none}#error{position:absolute;inset:20px;color:white;font:16px sans-serif;pointer-events:none}</style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Clash of Errors rendering foundation"></canvas>
  <div id="error" role="alert"></div>
  <script>
    const canvas = document.getElementById("unity-canvas");
    let instance;
    let disposed = false;
    // The host validates both source window and origin. This template also works standalone.
    const hostOrigin = document.referrer ? new URL(document.referrer).origin : location.origin;
    const notify = (type, value) => parent.postMessage({ channel: "clash-unity", type, value }, hostOrigin);
    const fail = message => { document.getElementById("error").textContent = String(message); notify("error"); };
    const script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onerror = () => fail("Unity loader unavailable. Return to the host and retry.");
    script.onload = () => {
      if (disposed) return;
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: (message, type) => { if (type === "error") fail(message); }
      }, value => notify("progress", value)).then(async result => {
        if (disposed) { await result.Quit(); return; }
        instance = result;
        notify("ready");
      }).catch(fail);
    };
    canvas.addEventListener("pointerdown", () => canvas.focus());
    window.addEventListener("pagehide", () => { disposed = true; if (instance) void instance.Quit(); });
    document.body.appendChild(script);
  </script>
</body>
</html>
